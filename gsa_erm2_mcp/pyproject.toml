[project]
name = "gsa-erm2-mcp"
version = "0.1.0"
description = "GSA ERM2 MCP toolkit: weather, programming jokes, and unit conversion"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
